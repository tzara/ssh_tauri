[package]
name = "remote-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "remote_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri       = { version = "2.11.3", features = [] }
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.150"
toml        = "1.1.2"
anyhow      = "1.0.103"

[build-dependencies]
tauri-build = { version = "2", features = [] }
